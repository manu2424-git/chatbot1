<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Guidance Assistant</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #080f24;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at top left, #17234a 0%, #0b1229 35%, #080f24 70%);
        }

        .header {
            min-height: 78px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 25px;
            border-bottom: 1px solid #202b48;
            background: rgba(11, 18, 41, .95);
        }

        .logo-section { display: flex; align-items: center; gap: 13px; }

        .logo {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #27d6d8, #1aa5c7);
            font-size: 23px;
        }

        .header h1 { font-size: 19px; }
        .header p { margin-top: 5px; font-size: 10px; color: #91a4cc; }
        .status { color: #2de1b7; font-size: 20px; text-shadow: 0 0 10px #2de1b7; }

        .course-bar {
            min-height: 58px;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 9px 17px;
            overflow-x: auto;
            background: #0b132c;
            border-bottom: 1px solid #202b48;
        }

        .course-bar button {
            flex-shrink: 0;
            border: 1px solid #293659;
            background: #111a35;
            color: #c1cce3;
            border-radius: 22px;
            padding: 9px 15px;
            font-size: 12px;
            cursor: pointer;
        }

        .course-bar button:hover {
            background: #1c2b52;
            color: #55e1df;
            border-color: #36cbd1;
        }

        .chat-area {
            flex: 1;
            padding: 28px;
            padding-bottom: 100px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 11px;
            margin-bottom: 20px;
            max-width: 1200px;
        }

        .user-row { margin-left: auto; justify-content: flex-end; }

        .avatar {
            width: 35px;
            height: 35px;
            flex-shrink: 0;
            border-radius: 10px;
            display: grid;
            place-items: center;
            background: #182543;
            border: 1px solid #2c3b60;
        }

        .user-avatar { background: #153b4a; border-color: #248d9d; }

        .message {
            max-width: 950px;
            padding: 17px 20px;
            border-radius: 15px;
            font-size: 13px;
            line-height: 1.75;
            overflow-wrap: anywhere;
        }

        .bot-message {
            background: linear-gradient(135deg, #192544, #111b35);
            border: 1px solid #253454;
            color: #d7def0;
            border-top-left-radius: 5px;
        }

        .user-message {
            background: linear-gradient(135deg, #126e7d, #164d67);
            color: white;
            border-top-right-radius: 5px;
        }

        .welcome-box p { margin-bottom: 10px; }
        .welcome-box p:last-child { margin-bottom: 0; }
        .welcome-box span, .examples { color: #43dedc; font-weight: 600; }

        .course-details { width: 100%; max-width: 850px; }

        .course-title {
            color: #43dedc;
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid #304267;
        }

        .detail-section { margin-bottom: 19px; }

        .detail-heading {
            color: #35d7d4;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .detail-text { color: #d7def0; font-size: 13px; line-height: 1.8; }
        .detail-list { padding-left: 22px; }

        .detail-list li {
            color: #d7def0;
            margin-bottom: 5px;
            font-size: 13px;
        }

        .detail-list li::marker { color: #2bd2d0; }

        .salary-box {
            background: rgba(38, 210, 208, .08);
            border: 1px solid rgba(38, 210, 208, .25);
            padding: 13px;
            border-radius: 10px;
        }

        .final-message { margin-top: 18px; color: #9fb1d3; font-style: italic; }

        .loading { color: #7f91b8; font-size: 13px; }

        .input-area {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 1100px;
            min-height: 58px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 8px 6px 17px;
            background: #071225;
            border: 1px solid #263653;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0,0,0,.4);
        }

        .input-area input {
            flex: 1;
            min-width: 0;
            height: 43px;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font-size: 13px;
        }

        .input-area input::placeholder { color: #71809f; }

        .input-area button {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #28d0d2, #1ba5bd);
            color: #071225;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .input-area button:disabled { opacity: .5; cursor: wait; }

        @media (max-width: 600px) {
            .header { min-height: 68px; padding: 9px 12px; }
            .header h1 { font-size: 14px; }
            .header p { font-size: 9px; }
            .logo { width: 38px; height: 38px; }
            .course-bar { min-height: 50px; }
            .course-bar button { padding: 8px 12px; font-size: 11px; }
            .chat-area { padding: 18px 10px 90px; }
            .message { max-width: 90%; padding: 12px; font-size: 12px; }
            .course-title { font-size: 16px; }
            .detail-heading { font-size: 12px; }
            .detail-text, .detail-list li { font-size: 12px; }
            .input-area { width: calc(100% - 20px); bottom: 8px; }
        }
    </style>
</head>

<body>
<div class="app">

    <header class="header">
        <div class="logo-section">
            <div class="logo">🎓</div>
            <div>
                <h1>Career Guidance Assistant</h1>
                <p>Powered by AI • Course Details • Government Careers</p>
            </div>
        </div>
        <div class="status" title="Career assistant">●</div>
    </header>

    <div class="course-bar">
        <button onclick="askCourse('BBA')">📊 BBA</button>
        <button onclick="askCourse('B.Com')">💼 B.Com</button>
        <button onclick="askCourse('BFA')">🎨 BFA</button>
        <button onclick="askCourse('B.Des')">✏️ B.Des</button>
        <button onclick="askCourse('MBBS')">🏥 MBBS</button>
        <button onclick="askCourse('B.Tech')">💻 B.Tech</button>
        <button onclick="askCourse('Diploma')">🎓 Diploma</button>
        <button onclick="askCourse('CA')">📚 CA</button>
        <button onclick="askCourse('MBA')">🏢 MBA</button>
        <button onclick="askCourse('B.Sc')">🔬 B.Sc</button>
        <button onclick="askCourse('UPSC')">🏛️ UPSC</button>
    </div>

    <main class="chat-area" id="chatArea">
        <div class="message-row">
            <div class="avatar">🤖</div>
            <div class="message bot-message">
                <div class="welcome-box">
                    <p>👋 <span>Welcome!</span> I'm your Career Guidance Assistant.</p>
                    <p>💻 Get course information by typing a course name or selecting a button above.</p>
                    <p>💡 Examples: <span>BBA, MBBS, BFA, UPSC, B.Tech, Diploma, CA, B.Sc</span></p>
                </div>
            </div>
        </div>
    </main>

    <form class="input-area" id="chatForm">
        <input type="text" id="messageInput"
               placeholder="Type a course name: BBA, MBBS, BFA, B.Tech..."
               autocomplete="off">
        <button id="sendButton" type="submit" aria-label="Send message">➤</button>
    </form>

</div>

<script>
    // Deployed Flask backend URL
    const API_URL = "https://chatbot1-3svg.onrender.com";

    const input = document.getElementById("messageInput");
    const chatArea = document.getElementById("chatArea");
    const chatForm = document.getElementById("chatForm");
    const sendButton = document.getElementById("sendButton");

    function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = String(value ?? "");
        return div.innerHTML;
    }

    function addUserMessage(message) {
        const row = document.createElement("div");
        row.className = "message-row user-row";

        const messageBox = document.createElement("div");
        messageBox.className = "message user-message";
        messageBox.textContent = message;

        const avatar = document.createElement("div");
        avatar.className = "avatar user-avatar";
        avatar.textContent = "👤";

        row.append(messageBox, avatar);
        chatArea.appendChild(row);
        scrollToBottom();
    }

    function addBotMessage(html) {
        const row = document.createElement("div");
        row.className = "message-row";

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "🤖";

        const messageBox = document.createElement("div");
        messageBox.className = "message bot-message";
        messageBox.innerHTML = html;

        row.append(avatar, messageBox);
        chatArea.appendChild(row);
        scrollToBottom();
    }

    function listItems(items) {
        if (!Array.isArray(items) || items.length === 0) {
            return "<li>Refer to the official course or institution website for details.</li>";
        }
        return items.map(item => `<li>${escapeHtml(item)}</li>`).join("");
    }

    function createCourseHTML(course) {
        if (!course || typeof course !== "object") {
            return "<p>Course details were not returned by the server. Please try again.</p>";
        }

        return `
            <div class="course-details">
                <div class="course-title">📘 ${escapeHtml(course.title || "Course Details")}</div>

                <div class="detail-section">
                    <div class="detail-heading">1️⃣ Course Introduction</div>
                    <div class="detail-text">${escapeHtml(course.introduction || "Details not available.")}</div>
                </div>

                <div class="detail-section">
                    <div class="detail-heading">2️⃣ Eligibility</div>
                    <div class="detail-text">${escapeHtml(course.eligibility || "Check the official admission requirements.")}</div>
                </div>

                <div class="detail-section">
                    <div class="detail-heading">3️⃣ Duration</div>
                    <div class="detail-text">${escapeHtml(course.duration || "Duration depends on the institution and course structure.")}</div>
                </div>

                <div class="detail-section">
                    <div class="detail-heading">4️⃣ Entrance Exams</div>
                    <ul class="detail-list">${listItems(course.entrance)}</ul>
                </div>

                <div class="detail-section">
                    <div class="detail-heading">5️⃣ Top Career Options</div>
                    <ul class="detail-list">${listItems(course.careers)}</ul>
                </div>

                <div class="detail-section">
                    <div class="detail-heading">6️⃣ Higher Studies</div>
                    <ul class="detail-list">${listItems(course.higher)}</ul>
                </div>

                <div class="detail-section">
                    <div class="detail-heading">7️⃣ Skills Required</div>
                    <ul class="detail-list">${listItems(course.skills)}</ul>
                </div>

                <div class="detail-section">
                    <div class="detail-heading">8️⃣ Government Career Options</div>
                    <ul class="detail-list">${listItems(course.government)}</ul>
                </div>

                <div class="detail-section">
                    <div class="detail-heading">💰 9️⃣ Approximate Salary / Career Scope</div>
                    <div class="salary-box">
                        <strong>Approximate salary:</strong> ${escapeHtml(course.salary || "Varies by role, experience, location and employer.")}
                        <br><br>
                        <strong>Career scope:</strong> ${escapeHtml(course.scope || "Career opportunities depend on skills, qualifications and experience.")}
                    </div>
                </div>

                <div class="detail-section">
                    <div class="detail-heading">📌 🔟 Course-Specific Details</div>
                    <div class="detail-text">
                        ${escapeHtml(course.specific_details || "Choose your specialization based on your interests, strengths and career goals. Check the official institution website for current admission rules.")}
                    </div>
                </div>

                <div class="final-message">🎓 Ask me about another course or career!</div>
            </div>
        `;
    }

    function scrollToBottom() {
        requestAnimationFrame(() => {
            chatArea.scrollTop = chatArea.scrollHeight;
        });
    }

    async function sendMessage() {
        const message = input.value.trim();
        if (!message || sendButton.disabled) return;

        addUserMessage(message);
        input.value = "";
        sendButton.disabled = true;

        const loadingRow = document.createElement("div");
        loadingRow.className = "message-row";
        loadingRow.innerHTML = `
            <div class="avatar">🤖</div>
            <div class="message bot-message"><div class="loading">Thinking...</div></div>
        `;
        chatArea.appendChild(loadingRow);
        scrollToBottom();

        try {
            const response = await fetch(`${API_URL}/chat`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message })
            });

            const data = await response.json().catch(() => ({}));
            loadingRow.remove();

            if (!response.ok) {
                throw new Error(data.error || data.response || `Server returned HTTP ${response.status}`);
            }

            if (data.found && data.course) {
                addBotMessage(createCourseHTML(data.course));
            } else {
                const reply = data.response || data.error || "I couldn't find that course.";
                addBotMessage(`
                    <p>ℹ️ ${escapeHtml(reply)}</p>
                    <p style="margin-top:10px">Try: <span class="examples">BBA, B.Com, BFA, B.Des, MBBS, B.Tech, Diploma, CA, MBA, B.Sc or UPSC</span></p>
                `);
            }
        } catch (error) {
            loadingRow.remove();
            console.error("Career API error:", error);

            addBotMessage(`
                <p>❌ Unable to connect to the career assistant.</p>
                <p style="margin-top:8px">Please try again in a few seconds.</p>
                <p style="margin-top:8px;color:#9fb1d3">
                    If this continues, check the Render backend logs and API configuration.
                </p>
            `);
        } finally {
            sendButton.disabled = false;
            input.focus();
        }
    }

    function askCourse(course) {
        input.value = course;
        sendMessage();
    }

    chatForm.addEventListener("submit", function(event) {
        event.preventDefault();
        sendMessage();
    });
</script>
</body>
</html>
